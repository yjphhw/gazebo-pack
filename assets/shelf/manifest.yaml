# 银灰色金属货架 — 资产包交接单（MANIFEST_SPEC v1.0）
# brief: 货架，1×1×2m，银灰色，1个动态，collision 要真实
schema_version: 1
kind: model-package
name: shelf
description: "银灰色金属货架，1×1×2 m，五层开放式，立柱 0.05 m / 层板 0.03 m"

source:
  blend: model.blend
  meshes:
    - file: source/shelf.glb
      instance: "00"          # 引号必加（YAML 00 会读成 0）

mass: 30.0                    # kg —— 1×2 m 钢制货架估重（非实心体积）
inertia: auto                 # 多 collision 形状求和，需 sdf ≥ 1.11
static: false                 # brief 明确 1 个动态

geometry:
  size: [1.0, 1.0, 2.0]       # 与建模脚本 SIZE 一致

# ── collision 要真实：手列 4 立柱 + 5 层板（层间是真空腔）──
# 不用 convex_hull（会把整架填成一坨）；primitives 精度确定、无 VHACD 不确定性。
collision:
  type: primitives
  primitives:
    - {shape: box, size: [0.05, 0.05, 2.0], pose: [-0.475, -0.475, 0.0, 0, 0, 0]}
    - {shape: box, size: [0.05, 0.05, 2.0], pose: [ 0.475, -0.475, 0.0, 0, 0, 0]}
    - {shape: box, size: [0.05, 0.05, 2.0], pose: [-0.475,  0.475, 0.0, 0, 0, 0]}
    - {shape: box, size: [0.05, 0.05, 2.0], pose: [ 0.475,  0.475, 0.0, 0, 0, 0]}
    - {shape: box, size: [0.96, 0.96, 0.03], pose: [0.0, 0.0, -0.85, 0, 0, 0]}
    - {shape: box, size: [0.96, 0.96, 0.03], pose: [0.0, 0.0, -0.40, 0, 0, 0]}
    - {shape: box, size: [0.96, 0.96, 0.03], pose: [0.0, 0.0,  0.05, 0, 0, 0]}
    - {shape: box, size: [0.96, 0.96, 0.03], pose: [0.0, 0.0,  0.50, 0, 0, 0]}
    - {shape: box, size: [0.96, 0.96, 0.03], pose: [0.0, 0.0,  0.95, 0, 0, 0]}

frame:
  origin: center              # AABB 中心 = 原点（V5）
  # visual_pose 不写 = 层①默认 roll +90°

gazebo:
  sdf_version: "1.11"

world:
  name: shelf_world
  layout:
    type: grid
    cols: 1
    # pitch 默认 2×max(size) = 4.0
    # z 默认 auto → center → z = 1.0（不做仿真贴地验证，见 §7 纪律 8）
  ground: true
  sun: true
  plugins: default
